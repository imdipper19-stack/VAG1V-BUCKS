version: '3.8'

# Production-compose. Развёртывание:
#   1. cd /opt/bag1v-bucks && git pull
#   2. docker compose build
#   3. docker compose --profile production up -d
#
# Размеры памяти подобраны под VPS 4 vCPU / 8 GB:
#   postgres:  512 MB
#   redis:     128 MB
#   backend:   2 GB (включая 3 Chromium инстанса по ~400 MB)
#   frontend:  512 MB
#   nginx:     128 MB
#   ── всего ~3.3 GB, остаётся ~4.7 GB запаса

services:
  postgres:
    image: postgres:15-alpine
    container_name: bag1vbucks-postgres
    environment:
      POSTGRES_DB: bag1vbucks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bag1vbucks-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bag1vbucks-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      # На проде Chromium всегда headless (нет X-сервера)
      API_PURCHASE_HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # /dev/shm для Chromium: 64 MB по умолчанию не хватает для 3 инстансов из BrowserPool —
    # появляются "Target closed" / "Page crashed" ошибки в Cloudflare-проверках.
    shm_size: 2gb
    mem_limit: 2g
    volumes:
      # Сохраняем диагностические скриншоты при фейлах (no_session_token, razer_no_otp, etc).
      # Без этого volume они теряются при перезапуске контейнера.
      - ./backend/screenshots:/app/screenshots
      # Ключи AntilopaPay — не в git, монтируем с хоста
      - ./backend/secrets:/app/secrets:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://bag1v-bucks.shop/api
    container_name: bag1vbucks-frontend
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

  nginx:
    image: nginx:alpine
    container_name: bag1vbucks-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    mem_limit: 128m
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
