version: '3.8'

# Dev-режим: hot reload для backend и frontend
# Запуск: docker compose -f docker-compose.dev.yml up
#
# Backend:  http://localhost:3001
# Frontend: http://localhost:3000
# DB:       localhost:5433
# Redis:    localhost:6379

services:
  postgres:
    image: postgres:15-alpine
    container_name: bag1vbucks-postgres-dev
    environment:
      POSTGRES_DB: bag1vbucks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bag1vbucks-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: bag1vbucks-backend-dev
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: bag1vbucks-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  backend_node_modules:
  frontend_node_modules:
